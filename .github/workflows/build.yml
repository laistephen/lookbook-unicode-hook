name: Build Lookbook Hook DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Clone MinHook Source
      run: git clone https://github.com/TsudaKageyu/minhook.git
      shell: pwsh

    - name: Compile Hook DLL Directly
      run: |
        cl /EHsc /LD /O2 /utf-8 main.cpp minhook/src/buffer.c minhook/src/hook.c minhook/src/trampoline.c minhook/src/hde/hde32.c minhook/src/hde/hde64.c /I"minhook/include" /I"minhook/src" user32.lib kernel32.lib /Fe:LookbookHook.dll
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LookbookHook-x86
        path: LookbookHook.dll
